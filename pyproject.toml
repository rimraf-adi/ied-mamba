[project]
name = "ied"
version = "0.1.0"
description = "TUH EEG Event Corpus Processing & Mamba IED State Space Model"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dash>=2.17.0",
    "einops>=0.7.0",
    "mambapy>=1.2.0",
    "matplotlib>=3.7.0",
    "mne>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "pyedflib>=0.1.35",
    "pywavelets>=1.9.0",
    "reportlab>=5.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.66.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
